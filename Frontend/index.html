<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="stylesheet.css">
  <title>DB Project 1</title>
</head>
<body>
  <main>
      <label>Name:</label>
      <input type="text" id="name-input">
      <button id="add-name-btn">Add Name</button>
 
     <br><br><br>
     <div> 
        <label>Search by...</label> <br>
        Name: <input placeholder="Name" id="search-input">
        <button id="name">Search</button> <br>
        UserID:<input placeholder="UserID" id="search-input">
        <button id="user">Search</button> <br>
        Salary between <input placeholder="LowerSalary" id="search-input">
        and <input placeholder="UpperSalary" id="search-input">
        <button id="salary">Search</button> <br>
        Age between <input placeholder="LowerAge" id="search-input">
        and <input placeholder="UpperAge" id="search-input">
        <button id="age">Search</button> <br>
        Registered after John  <button id="John">Search</button> <br>
        Registered same day as John <button id="same-day">Search</button> <br>
        Registered today: <button id="registered-today">Search</button> <br>
     </div>
     <br><br><br>

     <table id="table">
         <thead>
             <th>Id</th>
             <th>Name</th>
             <th>Date Added</th>
             <th>Delete</th>
             <th>Edit</th>  
         </thead>
         <tbody></tbody>
     </table>

     <section hidden id="update-row">
         <label>Name:</label>
         <input type="text" id="update-name-input">
         <button id="update-row-btn" value="">Update</button>
    </section>
</main>
<script src="index.js"></script>
</body>
</html>
