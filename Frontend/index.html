<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="stylesheet.css">
  <title>DB Project 1 new</title>
    
    <style>

        label{
          display: block;
          margin-bottom: 10px;
          padding:5px 0;
          box-sizing: border-box;
        }

        body{
          font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
          display: flex;
          flex-direction: column;
          justify-content: center;
          min-height: 100vh;
          margin:0;
          align-items: center;
          background-color: white;
        }
        
        h2{
          margin-top: 0;
          text-align: left;
          margin-bottom: 10px;
          color: rgb(26, 21, 21);
        }

        input{
          box-sizing: border-box;
          padding: 10px;
          max-width: 100%;
        }

        main{
          width: 90%;
        }

        table{
          width: 100%;
          max-width: 500px;
          margin-top: 20;
        }

        button{
          margin-top: 10px;
          padding: 10px 15px;
          cursor: pointer;
        }

        th{
          background-color: white;   
        }
        
        th,td{
          border: 1px solid;
          padding: 10px;
          text-align: left;
        }

        input{
          padding: 10px;
          width: 100%;
          box-sizing: border-box;
          max-width: 100%;
        }


        .registration-box{
          width: 100%;
          border-radius: 10px;
          box-sizing: border-box;
          padding: 20px;
          background-color: white;

        }

        .form-group input{
          margin-bottom:20px;
        }

        .search{
          margin: 20px 0;
          padding: 20px;
          border-radius: 10px;
          background-color: white;
        }

        .table-container{
          overflow: auto;
        }

        .text{
          overflow-wrap: anywhere;
        }

        .form-group{
          display: flex;
          flex-direction: column;
          margin-bottom: 10px;

        }
        .accounts-container{
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 20px;
          width: 100%;
          max-width: 1000px;
          align-items: start;
          margin-bottom: 20px;
        }


      #register-account{
        display:grid;
        grid-template-columns: 1fr 1fr;
        gap:10px;
        width:100%;
        /* max-width: 500px; */
        margin-bottom: 20px;
      }

      #register-account .full-width{
        grid-column: 1/3;
      }

      #register-account button{
        grid-column: 1/3;
      }

      


    </style>
    </head>
    <body>
      <main>
    <div class="accounts-container">
      <div class="registration-box">
        <h2>
          Create Account:
        </h2>

        <!-- usename -->
        <form id="register-account">
          <div class="form-group full-width">
            <label for="username-input">Username</label>
            <input type="text" id="username-input" maxlength="50">
          </div>

          <!-- first name -->
          <div class="form-group">
            <label for="firstname-input">First name</label>
            <input type="text" id="firstname-input" maxlength="50">
    
          </div>

          <!-- last name-->
           <div class="form-group">
            <label for="lastname-input">Last Name</label>
            <input type="text" id="lastname-input" maxlength="50">
          </div>

          <!-- password -->
           <div class="form-group full-width">
            <label for="password-input">Password</label>
            <input type="password" id="password-input" maxlength="50">
            </div>
            
            <!-- age -->
            <div class="form-group">
              <label for="age-input">Age</label>
              <input type="number" id="age-input" min="0" max="150" step="1">
              </div>

            <!-- salary -->
            <div class="form-group">
              <label for="salary-input">Salary</label>
              <input type="number" id="salary-input" min ="0" step="0.01">
            </div>

            <button type="submit">Register</button>
            </form>
            </div>

     <!-- sign in -->
<div class="registration-box">
  <h2>Sign-in</h2>
  <form id="signIn">
    <div class="form-group">
      <label for="username-signIn">Username</label>
      <input type="text" id="username-signIn">
    </div>
    <div class="form-group">
      <label for="password-signIn">Password</label>
      <input type="password" id="password-signIn">
    </div>
    <button type="submit">Sign in</button>
  </form>
</div>
</div>

     <!-- search by first and/or last name -->
      <div class="search">
        <h2>Search by name</h2>
        <form id="name-search">
          <label for="firstname-search">First Name</label>
          <input type="text" id="firstname-search">
          

          <label for="lastname-search">Last Name</label>
          <input type="text" id="lastname-search">
          <button type="submit">Search Name</button>
        </form>
      </div>

      <div class="search">
        <h2>Search by ID</h2>
        <input type="text" id="search-input-id" placeholder="Enter username">
        <button type="button" id="search-btn-id">Search</button>
      </div>

      <div class="search">
        <h2>Search by salary</h2>
        <form id="salary-search">
          <label for="minimum-salary">Minimum</label>
          <input type="number" id="minimum-salary" min="0" step="0.01">
          <label for="maximum-salary">Maximum</label>
          <input type="number" id="maximum-salary" min="0" step="0.01">
          
          <button type="submit">Search</button>
        </form>
      </div>

        <br>
    <div class="search">
        Ages between <input placeholder="age1" id="search-input-age1"> and
        <input placeholder="age2" id="search-input-age2">
        <button id="search-btn-age">Search</button>
        <br>
        
        <input placeholder="Registered after ID" id="input-reg-after-ID">
        <button id="btn-reg-after-ID">Search</button>
        <br>

        <input placeholder="Registered same day as ID" id="input-reg-same-day-ID">
        <button id="btn-reg-same-day-ID">Search</button>
        <br>

        <button id="btn-reg-today">Registered Today</button>

      </div>

     </div>
     <br><br><br>


     <!-- <table id="table">
         <thead>
             <th>Id</th>
             <th>Name</th>
             <th>Date Added</th>
             <th>Delete</th>
             <th>Edit</th>  
         </thead>
         <tbody></tbody>
     </table>

     <section hidden id="update-row">
         <label>Name:</label>
         <input type="text" id="update-name-input">
         <button id="update-row-btn" value="">Update</button> -->


         <table id="table">
          <thead>
            <tr>
              <th>Username</th>
              <th>First name</th>
              <th>Last name</th>
              <th>Age</th>
              <th>Salary</th>
              <th>Register day</th>
              <th>Sign-in time</th>
              </tr>
                </thead>
              <tbody></tbody>
              </table>


    </section>
</main>
<script src="index.js"></script>
</body>
</html>
